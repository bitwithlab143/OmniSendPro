# OmniSendPro — local / single-host deployment (ARCHITECTURE.md §38, design DS-14).
#
#   cp .env.example .env            # then set secrets
#   docker compose up -d --build    # postgres, redis, migrate, backend, web
#   open http://localhost:8081      # admin  (bootstrap admin from .env)
#   open http://localhost:8080      # user panel
#
# Workers are provisioned in the admin panel; put WORKER_ID / WORKER_CREDENTIAL in .env, then:
#   docker compose --profile worker up -d worker
# With a *pool* credential (Provision → Pool) any number of containers can share it, each registering
# under its hostname: `docker compose --profile worker up -d --scale worker=4 worker`, or let
# infrastructure/autoscale/compose_autoscaler.py follow the omnisend_workers_desired metric (design DS-23).
# Local SMTP sink for testing (provider host "mailpit", port 1025, security "None"):
#   docker compose --profile dev up -d mailpit     # UI on http://localhost:8025

name: omnisendpro

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-omnisend}:${POSTGRES_PASSWORD:-omnisend}@postgres:5432/${POSTGRES_DB:-omnisend}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-}
  WORKER_JWT_SECRET: ${WORKER_JWT_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-true}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  # Optional object storage for large recipient files (design DS-21); see the `storage` profile below.
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
  OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnisend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnisend}
      POSTGRES_DB: ${POSTGRES_DB:-omnisend}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so rate-limit/quota state survives restarts (§46). Job state lives in Postgres.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    image: omnisendpro/backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    image: omnisendpro/backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_SCHEDULER: "false"   # background work runs in the `runner` service (design DS-19)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["8000"]

  # Scheduler (leader-elected) + event/import processor. Scale the processor with
  #   docker compose up -d --scale runner=2   (only one instance leads the scheduler at a time)
  runner:
    image: omnisendpro/backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.runner"]
    stop_grace_period: 30s
    healthcheck: { disable: true }   # the image's check probes the HTTP API, which the runner does not serve
    environment: *backend-env
    depends_on:
      backend: { condition: service_started }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: omnisendpro/web:local
    restart: unless-stopped
    depends_on: [backend]
    environment:
      STORAGE_UPLOAD_ORIGIN: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-}
    ports:
      - "${USER_PORT:-8080}:8080"
      - "${ADMIN_PORT:-8081}:8081"
      - "${WORKER_API_PORT:-8082}:8082"

  worker:
    profiles: ["worker"]
    build: { context: ., dockerfile: infrastructure/docker/worker.Dockerfile }
    image: omnisendpro/worker:local
    restart: unless-stopped
    stop_grace_period: 70s
    environment:
      WORKER_API_URL: http://backend:8000
      WORKER_ID: ${WORKER_ID:-}
      WORKER_CREDENTIAL: ${WORKER_CREDENTIAL:-}
      REDIS_URL: ${WORKER_REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: [backend]

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    expose: ["1025"]

  # Local S3-compatible storage for large recipient uploads:
  #   OBJECT_STORAGE_ENDPOINT=http://minio:9000 OBJECT_STORAGE_PUBLIC_ENDPOINT=http://localhost:9000
  #   OBJECT_STORAGE_BUCKET=omnisend-imports OBJECT_STORAGE_ACCESS_KEY=… OBJECT_STORAGE_SECRET_KEY=…
  #   docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-omnisend}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-omnisend-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$${MINIO_USER}" "$${MINIO_PASSWORD}"; do sleep 1; done &&
        mc mb -p "local/$${BUCKET}" &&
        mc ilm rule add --expire-days 2 --prefix imports/ "local/$${BUCKET}" || true
    environment:
      MINIO_USER: ${OBJECT_STORAGE_ACCESS_KEY:-omnisend}
      MINIO_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-omnisend-dev-secret}
      BUCKET: ${OBJECT_STORAGE_BUCKET:-omnisend-imports}

  # Monitoring stack (design DS-23, P4-04/05): docker compose --profile monitoring up -d
  #   Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD), Prometheus :9090, Alertmanager :9093
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infrastructure/monitoring/secrets:/etc/alertmanager/secrets:ro   # slack_webhook_url, smtp_password
    ports: ["127.0.0.1:9093:9093"]

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infrastructure/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  minio-data:
  postgres-data:
  redis-data:
