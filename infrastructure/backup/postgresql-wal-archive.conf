# Point-in-time recovery (design DS-23, P4-06): continuous WAL archiving on the primary.
# Include from postgresql.conf, adapt archive_command to your storage (example: a mounted volume; for
# object storage use wal-g or pgBackRest). Keep base backups (pg_basebackup or backup.sh) + WAL for the
# recovery window you need (e.g. 14 days).
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
archive_timeout = 300          # force a segment switch at least every 5 minutes (RPO ≤ 5 min)
max_wal_senders = 10           # streaming replica(s) + pg_basebackup
wal_keep_size = 1GB
