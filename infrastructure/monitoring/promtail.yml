# Ships the JSON logs of every OmniSendPro container to Loki (design DS-23, P4-04).
server: { http_listen_port: 9080, grpc_listen_port: 0 }
positions: { filename: /tmp/positions.yaml }
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters: [{ name: label, values: ["com.docker.compose.project=omnisendpro"] }]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions: { level: level, event: event, logger: logger }
      - labels: { level: "", logger: "" }
