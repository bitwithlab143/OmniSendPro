# Example Prometheus scrape config (ARCHITECTURE.md §43–§44). Scrape the backend directly on the
# internal network — /metrics is intentionally not exposed through the panels' nginx servers.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: omnisend-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
rule_files:
  - alerts.yml
