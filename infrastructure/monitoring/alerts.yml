groups:
  - name: omnisend
    rules:
      - alert: NoOnlineWorkers
        expr: omnisend_workers_online == 0 and omnisend_queue_depth > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Jobs are queued but no worker is online" }
      - alert: ProviderDisabled
        expr: omnisend_providers_disabled > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "At least one provider is DISABLED" }
      - alert: ProviderUnhealthy
        expr: omnisend_provider_health < 50
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Provider {{ $labels.provider }} health below 50" }
      - alert: DeadLetterGrowing
        expr: increase(omnisend_jobs{status="dead_letter"}[30m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Jobs are being dead-lettered" }
      - alert: QueueBacklog
        expr: omnisend_queue_depth > 1000
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Queue backlog above 1000 jobs for 15 minutes" }
      - alert: ApiDown
        expr: up{job="omnisend-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "The API /metrics endpoint is not reachable" }
      - alert: EventInboxBacklog
        expr: omnisend_event_inbox_oldest_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Provider reports have waited over 5 minutes: is the runner/processor running?" }
      - alert: EventInboxDeadLetters
        expr: omnisend_event_inbox_dead > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "{{ $value }} provider report(s) failed every processing attempt" }
      - alert: WorkersBelowDesired
        expr: omnisend_workers_online < omnisend_workers_desired
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Fewer workers online than the autoscaling signal asks for" }
      - alert: SendingStalled
        expr: omnisend_queue_depth > 0 and omnisend_sending_rate == 0 and omnisend_workers_online > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Jobs are queued and workers are online, but nothing is being sent" }
