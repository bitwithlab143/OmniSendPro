# Alertmanager routing (design DS-23, P4-05). Critical alerts go to Slack and email, warnings to email.
# Secrets are read from files mounted at /etc/alertmanager/secrets (never committed):
#   slack_webhook_url   – Slack incoming-webhook URL
#   smtp_password       – SMTP password for alert email
# Edit the addresses below for your team.
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true
route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: oncall
      repeat_interval: 1h
receivers:
  - name: email
    email_configs:
      - to: "ops@example.com"
        send_resolved: true
  - name: oncall
    email_configs:
      - to: "ops@example.com"
        send_resolved: true
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#omnisend-alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
inhibit_rules:
  - source_matchers: ['alertname="ApiDown"']
    target_matchers: ['severity="warning"']
