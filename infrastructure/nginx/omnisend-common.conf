client_max_body_size 55m;   # recipient uploads (backend enforces MAX_UPLOAD_BYTES)

location = /api/v1/auth/login  { limit_req zone=auth burst=5 nodelay; include /etc/nginx/omnisend-proxy.conf; }
location = /api/v1/auth/mfa/verify { limit_req zone=auth burst=5 nodelay; include /etc/nginx/omnisend-proxy.conf; }

# Workers never talk to the panels' hostnames; expose the worker API on a separate, restricted endpoint.
location /api/v1/worker/ { return 404; }

location /api/ { include /etc/nginx/omnisend-proxy.conf; }

location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff;
  try_files $uri =404;
}

location / {
  add_header Content-Security-Policy $spa_csp always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control "no-cache";
  try_files $uri /index.html;
}
