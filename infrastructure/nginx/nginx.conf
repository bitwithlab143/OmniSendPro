# nginx for OmniSendPro (ARCHITECTURE.md §39, §65). TLS is terminated in front of this (Cloudflare /
# load balancer); set HSTS there. User panel on :8080, Admin panel on :8081; both proxy /api.
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout json;

  # Login brute-force protection in addition to the application's own throttling.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream api { server backend:8000; keepalive 32; }

  # $spa_csp: rendered from templates/csp.conf.template at container start, so the object-storage
  # origin used for direct recipient uploads (STORAGE_UPLOAD_ORIGIN, design DS-21) can be allowed.
  include /etc/nginx/conf.d/csp.conf;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/user;
    include /etc/nginx/omnisend-common.conf;
  }

  server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/admin;
    include /etc/nginx/omnisend-common.conf;
  }

  # Worker API only (for remote worker VPSs, ADR-004). Put this behind its own hostname / IP allow-list.
  server {
    listen 8082;
    server_name _;
    client_max_body_size 8m;
    location /api/v1/worker/ { include /etc/nginx/omnisend-proxy.conf; }
    location / { return 404; }
  }
}
